name: ivhelper
description: Rang PvP des IV Pokémon GO en ligue super et hyper.
publish_to: none
version: 1.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.10.0
  shared_preferences: ^2.3.0
  http: ^1.2.0
  open_filex: ^4.5.0
  url_launcher: ^6.3.0
  flutter_overlay_window: ^1.0.2
  google_mlkit_text_recognition: ^1.0.2
  ivhelper_capture:
    path: packages/ivhelper_capture

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/species.json
    - assets/moves.json
    - assets/meta.json
