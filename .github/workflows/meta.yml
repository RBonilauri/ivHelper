name: Données PvPoke

# Chaque jour, récupère les données PvPoke et republie assets/meta.json,
# assets/species.json et assets/moves.json s'ils ont changé (avec la date du
# changement dans assets/game_data_version.json). L'appli télécharge la méta à
# l'ouverture de l'onglet Méta, et les espèces et attaques au démarrage.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les sources
        run: |
          mkdir -p /tmp/src && cd /tmp/src
          P=https://raw.githubusercontent.com/pvpoke/pvpoke/master/src/data
          A=https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv
          curl -sSfLO "$P/gamemaster.json"
          for c in 1500 2500 10000; do
            curl -sSfL -o "rankings-$c.json" "$P/rankings/all/overall/rankings-$c.json"
          done
          for f in pokemon_species_names moves move_names; do
            curl -sSfLO "$A/$f.csv"
          done
          # Coupes mises en avant par PvPoke ; une coupe sans classement
          # publié est ignorée.
          python3 "$GITHUB_WORKSPACE/tool/build_meta.py" --formats gamemaster.json |
            while read -r cup cp; do
              curl -sSfL -o "rankings-$cup-$cp.json" \
                "$P/rankings/$cup/overall/rankings-$cp.json" ||
                { rm -f "rankings-$cup-$cp.json"; echo "Pas de classement pour $cup ($cp)"; }
            done
      - name: Générer la méta
        run: python3 tool/build_meta.py /tmp/src assets/meta.json
      - name: Générer les espèces et les attaques
        run: |
          python3 tool/build_species.py /tmp/src/gamemaster.json \
            /tmp/src/pokemon_species_names.csv /tmp/src/moves.csv \
            /tmp/src/move_names.csv assets/species.json assets/moves.json
          if ! git diff --quiet assets/species.json assets/moves.json; then
            printf '{"updated":"%s"}\n' "$(date +%F)" > assets/game_data_version.json
          fi
      - name: Publier ce qui a changé
        run: |
          files="assets/meta.json assets/species.json assets/moves.json assets/game_data_version.json"
          if git diff --quiet $files; then
            echo "Données inchangées"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "data: données PvPoke du $(date +%F)"
          git push
